name: One-off Jest dependency removal and lockfile regeneration

on:
  push:
    branches:
      - fix/remove-unused-jest-once-20261028
    paths:
      - frontend/package.json
      - .github/workflows/refresh-jest-lock.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Select Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Regenerate frontend lockfile
        working-directory: frontend
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: yarn install --ignore-engines --non-interactive --network-timeout 120000
      - name: Check vulnerable once dependency has been pruned
        working-directory: frontend
        run: |
          if grep -q '^"@tootallnate/once@' yarn.lock; then
            echo '@tootallnate/once is still present in yarn.lock'
            exit 1
          fi
          if grep -q '^"@vue/cli-plugin-unit-jest@' yarn.lock; then
            echo 'Unused unit Jest CLI plugin remains'
            exit 1
          fi
          if grep -q '^jest@' yarn.lock; then
            echo 'Unused Jest package remains'
            exit 1
          fi
          echo 'Unused Jest dependency chain removed'
      - name: Commit regenerated yarn.lock
        run: |
          if ! git diff --quiet -- frontend/yarn.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/yarn.lock
            git commit -m "chore(frontend): prune unused Jest dependencies from yarn.lock"
            git push origin HEAD:fix/remove-unused-jest-once-20261028
          fi
      - name: Build frontend
        working-directory: frontend
        run: yarn build
      - name: Lint frontend
        working-directory: frontend
        run: yarn lint --no-fix
