name: One-off cleanup of unused Vue CLI dependency tree

on:
  push:
    branches:
      - fix/remove-unused-vue-cli-cookie-20261028
    paths:
      - frontend/package.json
      - .github/workflows/refresh-cookie-lock.yml

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Select Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Regenerate dependency graph
        working-directory: frontend
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: yarn install --ignore-engines --non-interactive --network-timeout 120000
      - name: Assert obsolete vulnerable CLI packages are gone
        working-directory: frontend
        run: |
          if grep -q '^cookie@0.4.0:' yarn.lock; then
            echo 'Vulnerable cookie@0.4.0 still present'
            exit 1
          fi
          if grep -q '^"@vue/cli@' yarn.lock; then
            echo 'Unneeded @vue/cli still present'
            exit 1
          fi
          if grep -q '^express@\^4.17.1:' yarn.lock; then
            echo 'Old express@4.17.1 dependency remains'
            exit 1
          fi
          echo "Obsolete Vue CLI / Express / cookie dependency chain removed"
      - name: Commit the updated Yarn Classic lockfile
        run: |
          if ! git diff --quiet -- frontend/yarn.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/yarn.lock
            git commit -m "chore(frontend): prune unused CLI dependencies from yarn.lock"
            git push origin HEAD:fix/remove-unused-vue-cli-cookie-20261028
          fi
      - name: Build
        working-directory: frontend
        run: yarn build
      - name: Lint
        working-directory: frontend
        run: yarn lint --no-fix
      - name: Run existing unit tests if available
        working-directory: frontend
        run: yarn test:unit --runInBand --passWithNoTests
