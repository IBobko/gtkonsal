name: One-off Vue CLI 5 upgrade verification

on:
  push:
    branches:
      - chore/vue-cli-5-security-20261028

permissions:
  contents: write

jobs:
  refresh-lockfile-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Use Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version
      - name: Regenerate the Yarn Classic dependency lockfile
        working-directory: frontend
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: yarn install --ignore-engines --non-interactive --network-timeout 120000
      - name: Commit regenerated yarn.lock to the upgrade branch
        run: |
          if ! git diff --quiet -- frontend/yarn.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/yarn.lock
            git commit -m "chore(frontend): refresh yarn.lock for Vue CLI 5"
            git push origin HEAD:chore/vue-cli-5-security-20261028
          fi
      - name: Build the frontend
        working-directory: frontend
        run: yarn build
      - name: Lint without modifications
        working-directory: frontend
        run: yarn lint --no-fix
      - name: Run available unit tests
        working-directory: frontend
        run: yarn test:unit --runInBand --passWithNoTests
      - name: Inspect node-forge dependency path
        working-directory: frontend
        run: yarn why node-forge || true
